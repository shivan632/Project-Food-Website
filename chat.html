<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }
    </style>
</head>
<body>
    <div id="chat-messages" class="p-4 h-64 overflow-y-auto">
    <div class="mb-4">
        <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs">
            <p>Hi there! 👋 How can I help you today?</p>
        </div>
    </div>
</div>
<div id="chat-loading" class="hidden p-3">
    <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs w-16">
        <div class="flex space-x-1">
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
        </div>
    </div>
</div>
<script>
    // config.js - Keep this separate and add to .gitignore
    const GEMINI_API_KEY = 'your-gemini-api-key-here'; // Replace with your actual key
    const GEMINI_MODEL = 'gemini-pro'; // Currently the most capable model

    // chatbot.js
    document.addEventListener('DOMContentLoaded', function() {
        const chatWidget = document.getElementById('chatbot-widget');
        const closeButton = document.getElementById('close-chatbot');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.querySelector('#chatbot-widget input');
        const sendButton = document.querySelector('#chatbot-widget button');
        const chatLoading = document.getElementById('chat-loading');
        
        // Toggle chatbot visibility
        closeButton.addEventListener('click', () => {
            chatWidget.classList.add('hidden');
        });
        
        // Initialize chat history for Gemini (format is different from OpenAI)
        let chatHistory = [
            { role: "model", parts: [{ text: "Hi there! 👋 How can I help you today?" }] }
        ];
        
        // Function to add a message to the chat
        function addMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'mb-4';
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = role === 'user' 
                ? 'bg-primary text-white rounded-lg p-3 max-w-xs ml-auto'
                : 'bg-gray-100 dark:bg-gray-700 rounded-lg p-3 max-w-xs';
            
            bubbleDiv.innerHTML = `<p>${text}</p>`;
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Function to call Gemini API
        async function callGemini(message) {
            chatLoading.classList.remove('hidden');
            
            // Add user message to history
            chatHistory.push({ role: "user", parts: [{ text: message }] });
            
            try {
                // Gemini requires the entire history in the request
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: chatHistory,
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 1000
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    const assistantMessage = data.candidates[0].content.parts[0].text;
                    addMessage('model', assistantMessage);
                    chatHistory.push({ role: "model", parts: [{ text: assistantMessage }] });
                } else {
                    console.error('Unexpected Gemini response:', data);
                    throw new Error('No valid response from Gemini');
                }
            } catch (error) {
                console.error('Error calling Gemini:', error);
                addMessage('model', "Sorry, I'm having trouble connecting. Please try again later.");
            } finally {
                chatLoading.classList.add('hidden');
            }
        }
        
        // Handle send button click
        sendButton.addEventListener('click', sendMessage);
        
        // Handle Enter key
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendMessage() {
            const message = chatInput.value.trim();
            if (message) {
                addMessage('user', message);
                chatInput.value = '';
                callGemini(message);
            }
        }
        
        // Optional: Add a toggle button to show/hide the chatbot
        const toggleButton = document.createElement('button');
        toggleButton.innerHTML = '<i class="fas fa-robot"></i>';
        toggleButton.className = 'fixed bottom-8 right-8 bg-primary text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center hover:bg-secondary transition-colors';
        toggleButton.addEventListener('click', () => {
            chatWidget.classList.toggle('hidden');
        });
        document.body.appendChild(toggleButton);
    });
</script>
</body>
</html>
